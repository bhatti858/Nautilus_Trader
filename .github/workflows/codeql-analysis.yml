name: codeql-analysis

permissions: # Principle of least privilege
  contents: read
  actions: read
  security-events: write # Required for CodeQL to upload SARIF

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
  push:
    branches: [nightly]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "rust"]
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ vars.STEP_SECURITY_EGRESS_POLICY || 'block' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}
            packages.microsoft.com:443
            azure.archive.ubuntu.com:80
            archive.ubuntu.com:80
            security.ubuntu.com:443
            motd.ubuntu.com:443
            esm.ubuntu.com:443
            release-assets.githubusercontent.com:443
            static.rust-lang.org:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Rust linker (lld)
        if: matrix.language == 'rust'
        run: |
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y lld -o Acquire::Retries=5

      - name: Get Rust toolchain version
        if: matrix.language == 'rust'
        id: rust-toolchain
        run: |
          TOOLCHAIN="$(bash scripts/rust-toolchain.sh)"
          printf 'toolchain=%s
' "$TOOLCHAIN" >> "$GITHUB_OUTPUT"

      - name: Set up Rust toolchain
        if: matrix.language == 'rust'
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.toolchain }}
          override: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          tools: >-
            https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.26.3/codeql-bundle-linux64.tar.zst

      - name: Autobuild
        if: matrix.language == 'rust'
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
